<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall -->
  <rect width="400" height="300" fill="#e8f4f8"/>
  <!-- Tiles -->
  <g stroke="#ccc" stroke-width="1" fill="none">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>
  <!-- Toilet -->
  <ellipse cx="80" cy="80" rx="35" ry="40" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <ellipse cx="80" cy="50" rx="30" ry="25" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <!-- Sink -->
  <rect x="240" y="50" width="60" height="50" rx="5" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <circle cx="270" cy="65" r="8" fill="#c0c0c0"/>
  <!-- Faucet -->
  <line x1="270" y1="50" x2="270" y2="40" stroke="#999" stroke-width="2"/>
  <circle cx="270" cy="35" r="5" fill="#999"/>
  <!-- Shower -->
  <rect x="280" y="140" width="100" height="120" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="330" cy="160" r="8" fill="#999" stroke="#333" stroke-width="1"/>
  <!-- Water droplets -->
  <circle cx="320" cy="180" r="2" fill="#87ceeb"/>
  <circle cx="330" cy="190" r="2" fill="#87ceeb"/>
  <circle cx="340" cy="180" r="2" fill="#87ceeb"/>
  <!-- Mirror -->
  <rect x="170" y="40" width="50" height="60" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <!-- Text -->
  <text x="200" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Bathroom</text>
</svg>
