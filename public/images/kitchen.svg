<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall -->
  <rect width="400" height="300" fill="#fffacd"/>
  <!-- Window -->
  <rect x="280" y="30" width="100" height="80" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="30" x2="330" y2="110" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="70" x2="380" y2="70" stroke="#333" stroke-width="1"/>
  <!-- Counter -->
  <rect x="30" y="80" width="200" height="120" fill="#a0826d" stroke="#333" stroke-width="2"/>
  <!-- Stove/Cooktop -->
  <rect x="50" y="100" width="80" height="60" fill="#333" stroke="#333" stroke-width="1"/>
  <circle cx="65" cy="115" r="8" fill="#666"/>
  <circle cx="85" cy="115" r="8" fill="#666"/>
  <circle cx="65" cy="135" r="8" fill="#666"/>
  <circle cx="85" cy="135" r="8" fill="#666"/>
  <!-- Sink -->
  <rect x="150" y="100" width="60" height="50" rx="5" fill="#c0c0c0" stroke="#333" stroke-width="2"/>
  <circle cx="170" cy="115" r="6" fill="#999"/>
  <!-- Faucet -->
  <line x1="170" y1="95" x2="170" y2="80" stroke="#999" stroke-width="2"/>
  <circle cx="170" cy="75" r="4" fill="#999"/>
  <!-- Cabinet -->
  <rect x="250" y="80" width="100" height="120" fill="#8b6f47" stroke="#333" stroke-width="2"/>
  <line x1="250" y1="120" x2="350" y2="120" stroke="#333" stroke-width="1"/>
  <line x1="250" y1="160" x2="350" y2="160" stroke="#333" stroke-width="1"/>
  <circle cx="340" cy="100" r="3" fill="#ffd700"/>
  <circle cx="340" cy="140" r="3" fill="#ffd700"/>
  <!-- Refrigerator -->
  <rect x="30" y="220" width="50" height="70" fill="#d3d3d3" stroke="#333" stroke-width="2"/>
  <line x1="30" y1="255" x2="80" y2="255" stroke="#333" stroke-width="1"/>
  <circle cx="72" cy="242" r="3" fill="#ffd700"/>
  <!-- Table -->
  <rect x="200" y="220" width="80" height="60" fill="#8b6f47" stroke="#333" stroke-width="2"/>
  <!-- Chairs -->
  <rect x="140" y="245" width="25" height="30" fill="#8b4513" stroke="#333" stroke-width="1"/>
  <rect x="295" y="245" width="25" height="30" fill="#8b4513" stroke="#333" stroke-width="1"/>
  <!-- Text -->
  <text x="200" y="295" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Kitchen & Mess</text>
</svg>
