<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall -->
  <rect width="400" height="300" fill="#f5e6d3"/>
  <!-- Window -->
  <rect x="280" y="40" width="100" height="80" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="40" x2="330" y2="120" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="80" x2="380" y2="80" stroke="#333" stroke-width="1"/>
  <!-- Door -->
  <rect x="10" y="150" width="50" height="120" fill="#8b6f47" stroke="#333" stroke-width="2"/>
  <circle cx="55" cy="210" r="4" fill="#ffd700"/>
  <!-- Bed -->
  <rect x="80" y="100" width="140" height="100" fill="#d4a574" stroke="#333" stroke-width="2"/>
  <rect x="85" y="105" width="130" height="90" fill="#e8c9a0"/>
  <!-- Pillow -->
  <rect x="85" y="105" width="130" height="20" fill="#f0deb3"/>
  <!-- Nightstand -->
  <rect x="230" y="120" width="40" height="40" fill="#a0826d" stroke="#333" stroke-width="1"/>
  <!-- Lamp -->
  <circle cx="250" cy="110" r="8" fill="#ffd700" stroke="#333" stroke-width="1"/>
  <line x1="250" y1="118" x2="250" y2="120" stroke="#333" stroke-width="1"/>
  <!-- Chair -->
  <rect x="280" y="200" width="35" height="35" fill="#8b4513" stroke="#333" stroke-width="1"/>
  <circle cx="298" cy="200" r="12" fill="#a0522d"/>
  <!-- Text -->
  <text x="200" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Single Room</text>
</svg>
