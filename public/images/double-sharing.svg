<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall -->
  <rect width="400" height="300" fill="#f5e6d3"/>
  <!-- Window -->
  <rect x="280" y="40" width="100" height="80" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="40" x2="330" y2="120" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="80" x2="380" y2="80" stroke="#333" stroke-width="1"/>
  <!-- Door -->
  <rect x="10" y="150" width="50" height="120" fill="#8b6f47" stroke="#333" stroke-width="2"/>
  <circle cx="55" cy="210" r="4" fill="#ffd700"/>
  <!-- Bed 1 -->
  <rect x="50" y="80" width="120" height="90" fill="#d4a574" stroke="#333" stroke-width="2"/>
  <rect x="55" y="85" width="110" height="80" fill="#e8c9a0"/>
  <!-- Bed 2 -->
  <rect x="180" y="80" width="120" height="90" fill="#c9a570" stroke="#333" stroke-width="2"/>
  <rect x="185" y="85" width="110" height="80" fill="#e0c0a0"/>
  <!-- Nightstand -->
  <rect x="310" y="100" width="35" height="35" fill="#a0826d" stroke="#333" stroke-width="1"/>
  <!-- Shelf -->
  <rect x="310" y="150" width="35" height="40" fill="#8b7355" stroke="#333" stroke-width="1"/>
  <line x1="310" y1="160" x2="345" y2="160" stroke="#333" stroke-width="0.5"/>
  <line x1="310" y1="170" x2="345" y2="170" stroke="#333" stroke-width="0.5"/>
  <!-- Text -->
  <text x="200" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Double Sharing</text>
</svg>
