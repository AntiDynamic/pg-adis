<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall -->
  <rect width="400" height="300" fill="#f5e6d3"/>
  <!-- Window -->
  <rect x="280" y="40" width="100" height="80" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="40" x2="330" y2="120" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="80" x2="380" y2="80" stroke="#333" stroke-width="1"/>
  <!-- Door -->
  <rect x="10" y="150" width="50" height="120" fill="#8b6f47" stroke="#333" stroke-width="2"/>
  <!-- Bunk 1 (left) -->
  <rect x="50" y="70" width="80" height="70" fill="#d4a574" stroke="#333" stroke-width="2"/>
  <rect x="50" y="145" width="80" height="70" fill="#c9a570" stroke="#333" stroke-width="2"/>
  <!-- Bunk 2 (middle) -->
  <rect x="145" y="70" width="80" height="70" fill="#d4a574" stroke="#333" stroke-width="2"/>
  <rect x="145" y="145" width="80" height="70" fill="#c9a570" stroke="#333" stroke-width="2"/>
  <!-- Bunk 3 (right) -->
  <rect x="240" y="70" width="80" height="70" fill="#d4a574" stroke="#333" stroke-width="2"/>
  <rect x="240" y="145" width="80" height="70" fill="#c9a570" stroke="#333" stroke-width="2"/>
  <!-- Shelf -->
  <rect x="330" y="100" width="30" height="100" fill="#8b7355" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="120" x2="360" y2="120" stroke="#333" stroke-width="0.5"/>
  <line x1="330" y1="140" x2="360" y2="140" stroke="#333" stroke-width="0.5"/>
  <line x1="330" y1="160" x2="360" y2="160" stroke="#333" stroke-width="0.5"/>
  <!-- Text -->
  <text x="200" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Triple Dorm</text>
</svg>
