<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall -->
  <rect width="400" height="300" fill="#f5e6d3"/>
  <!-- Windows -->
  <rect x="50" y="30" width="80" height="80" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="30" x2="90" y2="110" stroke="#333" stroke-width="1"/>
  <line x1="50" y1="70" x2="130" y2="70" stroke="#333" stroke-width="1"/>
  
  <rect x="270" y="30" width="80" height="80" fill="#87ceeb" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="30" x2="310" y2="110" stroke="#333" stroke-width="1"/>
  <line x1="270" y1="70" x2="350" y2="70" stroke="#333" stroke-width="1"/>
  <!-- Sofa -->
  <rect x="50" y="150" width="150" height="80" fill="#8b4513" stroke="#333" stroke-width="2"/>
  <rect x="55" y="155" width="140" height="70" fill="#a0522d"/>
  <!-- Cushions -->
  <circle cx="75" cy="160" r="8" fill="#cd853f"/>
  <circle cx="95" cy="160" r="8" fill="#cd853f"/>
  <circle cx="180" cy="160" r="8" fill="#cd853f"/>
  <!-- Coffee Table -->
  <rect x="220" y="160" width="80" height="50" fill="#8b4513" stroke="#333" stroke-width="2"/>
  <ellipse cx="260" cy="185" rx="20" ry="12" fill="#daa520" opacity="0.7"/>
  <!-- TV Stand -->
  <rect x="80" y="120" width="80" height="15" fill="#333"/>
  <!-- TV -->
  <rect x="95" y="100" width="50" height="35" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="100" y="105" width="40" height="25" fill="#0a0a0a"/>
  <!-- Bookshelf -->
  <rect x="280" y="140" width="80" height="100" fill="#8b7355" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="160" x2="360" y2="160" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="180" x2="360" y2="180" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="200" x2="360" y2="200" stroke="#333" stroke-width="1"/>
  <!-- Text -->
  <text x="200" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Common Lounge</text>
</svg>
